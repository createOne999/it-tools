name: Static release

env:
  VITE_VERCEL_ENV: production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create or update, for example v2026.1.4'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set release metadata
        shell: bash
        run: |
          tag_name='${{ github.ref_name }}'
          prerelease='false'

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            tag_name='${{ inputs.tag_name }}'
            prerelease='${{ inputs.prerelease }}'
          fi

          if [ -z "$tag_name" ]; then
            echo 'A release tag is required.' >&2
            exit 1
          fi

          release_version="${tag_name#v}"
          safe_version="$(printf '%s' "$release_version" | tr -c 'A-Za-z0-9._-' '-')"

          echo "TAG_NAME=$tag_name" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$safe_version" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_NAME=it-tools-$safe_version-static.tar.zst" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build static app
        run: pnpm build

      - name: Create tar.zst archive
        run: tar --zstd -cf "$RELEASE_ASSET_NAME" -C dist .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.RELEASE_ASSET_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          body: |
            ## Static web build

            - Build command: `pnpm build`
            - Asset: `${{ env.RELEASE_ASSET_NAME }}`
